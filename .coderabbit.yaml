# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  path_filters:
    - "!agent-plugins/orbit/dist/**"
    - "!bun.lock"
    - "!src-tauri/Cargo.lock"
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: >-
        React 상태 경계, 비동기 정리, 접근성, 렌더링 성능과 기존 FSD 모듈 경계를
        중점적으로 검토하세요.
    - path: "mcp/**/*.ts"
      instructions: >-
        MCP 도구 입력 검증, JSON-RPC 호환성, SQLite 데이터 무결성, 오류 메시지에
        민감정보가 노출되지 않는지를 중점적으로 검토하세요.
    - path: "src-tauri/**/*.rs"
      instructions: >-
        Tauri 명령의 최소 권한, 키체인과 토큰 처리, SQL 바인딩, panic 가능성과
        크로스 플랫폼 동작을 중점적으로 검토하세요.

chat:
  auto_reply: true
