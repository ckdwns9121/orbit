name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify FSD boundaries
        run: bun run verify:fsd

      - name: Type-check and build
        run: bun run build

      - name: Run frontend tests
        run: bun test

      - name: Type-check MCP server
        run: bun run mcp:typecheck

      - name: Verify committed MCP bundle
        run: |
          bun run mcp:bundle
          git diff --exit-code -- agent-plugins/orbit/dist/server.js

      - name: Verify release versions stay synchronized
        run: bun run release:check

  rust:
    name: Rust tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
